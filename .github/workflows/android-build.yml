name: Build Android APK
on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile (development/production)'
        required: true
        default: 'development'
        type: choice
        options:
        - development
        - production
  push:
    branches:
      - dev
    paths:
      - 'expo-app/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: expo-app/yarn.lock

      - name: Install dependencies
        working-directory: ./expo-app
        run: yarn install --frozen-lockfile

      - name: Expo Prebuild
        working-directory: ./expo-app
        env:
          APP_ENV: ${{ inputs.profile || 'development' }}
        run: |
          rm -rf android ios
          npx expo prebuild --platform android

      - name: Configure Gradle Memory
        working-directory: ./expo-app/android
        run: |
          # Reduce heap to 3GB to prevent runner OOM
          echo "org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options=\"-Xmx1024M\"" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties
          echo "org.gradle.parallel=false" >> gradle.properties

      - name: Build Android APK
        working-directory: ./expo-app/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: expo-app/android/app/build/outputs/apk/debug/app-debug.apk
